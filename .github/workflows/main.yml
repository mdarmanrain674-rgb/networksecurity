name: NetworkSecurity CI/CD

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: eu-north-1
  ECR_REPOSITORY: simple-docker-service-0a0ffa21fa03
  ECR_REGISTRY: 112188881325.dkr.ecr.eu-north-1.amazonaws.com

jobs:
  integration:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Lint code
        run: echo "Linting repository"

      - name: Run unit tests
        run: echo "Running unit tests"

  build-and-push-ecr-image:
    name: Continuous Delivery
    needs: integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA \
            .

      - name: Push Docker Image
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA

  Continuous-Deployment:
    name: Deploy to EC2
    needs: build-and-push-ecr-image
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Verify EC2 IAM role
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region $AWS_REGION | \
          docker login --username AWS --password-stdin $ECR_REGISTRY

      - name: Pull latest Docker image
        run: |
          docker pull $ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA

      - name: Stop and remove previous container
        run: |
          docker rm -f networksecurity || true

      - name: Run Docker Image
        run: |
          docker run -d \
            --restart unless-stopped \
            --name networksecurity \
            -p 8080:8000 \
            --env-file /home/ec2-user/networksecurity.env \
            $ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA

      - name: Check container status
        run: |
          docker ps --filter name=networksecurity
          docker logs --tail 30 networksecurity

      - name: Clean unused Docker images
        run: docker image prune -f
